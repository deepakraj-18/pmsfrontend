<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Techspear Project Management System — Manage projects, tasks, timesheets and teams." />


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <title>Techspear PMS</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('app-theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }

      // Splash shows only for: a refresh while already signed in (token present), the
      // logout redirect (AuthProvider sets this flag right before navigating here), or the
      // MS SSO callback landing back from Microsoft. A cold/direct visit to /login (typed
      // URL, bookmark, first-ever visit) gets no splash - just the login page itself once
      // React mounts.
      try {
        var path = window.location.pathname;
        // A stale token can sit in localStorage even when deliberately looking at /login
        // directly (no logout happened) - only count "signed in" for paths other than
        // /login itself, or a direct visit there would wrongly get the splash too.
        var hasToken = path !== '/login' && !!localStorage.getItem('pms_token');
        var postLogout = sessionStorage.getItem('post-logout');
        if (postLogout) sessionStorage.removeItem('post-logout');
        var isSsoCallback = path === '/redirect' || path === '/auth/ms-callback';
        var showSplash = hasToken || !!postLogout || isSsoCallback;
        if (!showSplash) {
          document.documentElement.classList.add('no-splash');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root">

    <style>
      html.no-splash #initial-loader {
        display: none;
      }

      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #f8fafc;
        font-family: 'Inter', system-ui, sans-serif;
        gap: 18px;
      }

      /* A curved reveal anchored at the peacock's feet (bottom-center) - no scale transform
         here, so it reads as the tail opening along a curve, not the icon growing/rising. */
      .peacock-logo {
        width: 120px;
        height: auto;
        clip-path: circle(0% at 50% 100%);
        filter: drop-shadow(0 8px 20px rgba(20, 184, 166, 0.25));
        animation:
          peacock-spread 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards,
          peacock-breathe 2.6s ease-in-out infinite;
        animation-delay: 0s, 1.3s;
      }

      .loader-text {
        color: #94a3b8;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @keyframes peacock-spread {
        0% {
          clip-path: circle(0% at 50% 100%);
        }
        100% {
          /* 150% safely overshoots the farthest corner from the bottom-center anchor, so
             every feather tip clears the reveal regardless of exact image proportions. */
          clip-path: circle(150% at 50% 100%);
        }
      }

      @keyframes peacock-breathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 8px 20px rgba(20, 184, 166, 0.25));
        }
        50% {
          transform: scale(1.025);
          filter: drop-shadow(0 10px 26px rgba(20, 184, 166, 0.4));
        }
      }

      /* Matches the app's own saved theme (the inline script above sets this class on <html>
         from localStorage), not the OS's prefers-color-scheme - the two can disagree if the
         user picked a theme in-app that differs from their system setting. */
      html.dark #initial-loader {
        background-color: #0f172a;
      }

      html.dark .loader-text {
        color: #475569;
      }
    </style>
    <div id="initial-loader">
      <img class="peacock-logo" src="/src/assets/techspear-logo-icon.png" alt="Techspear" />
      <div class="loader-text">Loading</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
